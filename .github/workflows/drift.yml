name: production drift check

# Answers one question without any credential: is production running a revision
# that was actually published from main?
#
# Both Workers report their released revision at GET /api/version. This job reads
# those two endpoints, requires them to agree, and then checks the revision
# against this clone's history. Being *behind* main is a pending release and is
# reported as information; a revision that is not in main's history, a split
# between the two Workers, or an unreported revision fails the run, because that
# means production was changed outside the pipeline.
#
# Read-only: no secrets, no deploy, no writes of any kind. See docs/CI-CD.md.

on:
  schedule:
    # Once a day, off the hour so it does not collide with other schedules.
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-drift
  cancel-in-progress: false

jobs:
  drift:
    name: production drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestry check needs main's history, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/verify-drift.mjs
